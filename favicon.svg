<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2232"/>
      <stop offset="100%" stop-color="#0e1017"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ba5ff"/>
      <stop offset="100%" stop-color="#5474f6"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Upper truss / bridge -->
  <path d="M18 20V15a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v5" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

  <!-- Stage area -->
  <rect x="12" y="20" width="40" height="30" rx="4" fill="#141722" stroke="url(#accent)" stroke-width="2.5"/>

  <!-- Spotlight Target / CAD Focus -->
  <circle cx="32" cy="35" r="8" fill="rgba(108,140,255,0.25)" stroke="#ffffff" stroke-width="2"/>
  <line x1="32" y1="29" x2="32" y2="41" stroke="#8ba5ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="26" y1="35" x2="38" y2="35" stroke="#8ba5ff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="35" r="2.5" fill="#ffffff"/>
</svg>
